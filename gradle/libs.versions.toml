[versions]
kotlin = "2.1.10"
kotlinxDatetime = "0.6.1"
kotlinxSerialization = "1.8.0"
kotlinxCoroutines = "1.10.1"
ktor = "2.3.13"
slf4j = "2.0.16"
logback = "1.5.16"
kotlinLogging = "7.0.5"
composeMultiplatform = "1.10.2"
androidGradlePlugin = "8.7.2"
androidxActivityCompose = "1.10.1"
androidxCore = "1.15.0"
zxing = "3.5.3"
junit = "5.11.4"
junitPlatform = "1.11.4"
mockk = "1.13.13"
assertj = "3.27.3"

[libraries]
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinxCoroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
ktorServerCore = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktorServerNetty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktorServerContentNegotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktorServerCallLogging = { module = "io.ktor:ktor-server-call-logging-jvm", version.ref = "ktor" }
ktorSerializationJson = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
ktorClientCore = { module = "io.ktor:ktor-client-core-jvm", version.ref = "ktor" }
ktorClientCio = { module = "io.ktor:ktor-client-cio-jvm", version.ref = "ktor" }
ktorClientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation-jvm", version.ref = "ktor" }
slf4jApi = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logbackClassic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
kotlinLogging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlinLogging" }
junitBom = { module = "org.junit:junit-bom", version.ref = "junit" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
assertjCore = { module = "org.assertj:assertj-core", version.ref = "assertj" }
androidxActivityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidxCoreKtx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
zxingCore = { module = "com.google.zxing:core", version.ref = "zxing" }

[bundles]
kotlinxCore = ["kotlinxDatetime", "kotlinxSerializationJson", "kotlinxCoroutinesCore"]
ktorServer = ["ktorServerCore", "ktorServerNetty", "ktorServerContentNegotiation", "ktorServerCallLogging", "ktorSerializationJson"]
ktorClient = ["ktorClientCore", "ktorClientCio", "ktorClientContentNegotiation", "ktorSerializationJson"]
testCore = ["junitJupiter", "junitPlatformLauncher", "mockk", "assertjCore", "kotlinxCoroutinesTest"]

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
androidApplication = { id = "com.android.application", version.ref = "androidGradlePlugin" }
